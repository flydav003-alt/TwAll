name: Cleanup Bad Trading Day Data

# 手動觸發：到 repo 的 Actions 分頁 → 選這個 workflow → 按 "Run workflow"
# 可以輸入要清除的日期（例如 2026-09-25），多個日期用空白分隔
on:
  workflow_dispatch:
    inputs:
      bad_dates:
        description: '要清除的錯誤交易日，多個日期用空白分隔 (格式: YYYY-MM-DD)'
        required: true
        default: '2026-09-25'

permissions:
  contents: write   # 需要寫入權限才能把清理結果 commit 回 repo

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run cleanup script
        run: |
          python cleanup_bad_trading_day.py ${{ github.event.inputs.bad_dates }}

      - name: Remove backup file before commit (太大不放進 repo 歷史)
        run: |
          rm -f data/stats.db.bak_*

      - name: Commit and push cleaned database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.db
          if git diff --cached --quiet; then
            echo "沒有變動，略過 commit"
          else
            git commit -m "chore: cleanup bad trading day data (${{ github.event.inputs.bad_dates }})"
            git push
          fi

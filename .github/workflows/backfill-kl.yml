name: Backfill Strategy K L

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy

      - run: python backfill_strategy_kl.py

      - name: Commit updated stats.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.db
          git diff --cached --quiet || git commit -m "回補策略K、L歷史訊號(6-9月)"
          git push

name: Rebuild outcomes for new horizons (one-time)

# 一次性手動執行：把 stats.db 依新的 HORIZONS（T+1/5/10/20/40）全部重算。
# 在副本上重算並對帳，驗證通過才會覆蓋 data/stats.db 並 commit；未通過會直接失敗，不會動到資料。
on:
  workflow_dispatch:
    inputs:
      max_mismatch_rate:
        description: "新舊 T+1/5/10 不一致占比上限（預設 0.02 = 2%）。看過診斷報告確認原因無害後，才調高重跑"
        type: string
        default: "0.02"
      drop_closed_day_events:
        description: "一併清除「訊號日當天大盤休市」（如颱風假 7/10、端午 6/19 仍跑出訊號）的事件，避免重複計算"
        type: boolean
        default: false
      force:
        description: "驗證未通過也強制覆蓋（一般請保持 false）"
        type: boolean
        default: false

concurrency:
  group: stats-db-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy openpyxl requests

      - name: Rebuild outcomes (validated, aborts on mismatch)
        run: python rebuild_horizons.py --max-mismatch-rate ${{ inputs.max_mismatch_rate }} ${{ inputs.drop_closed_day_events && '--drop-closed-day-events' || '' }} ${{ inputs.force && '--force' || '' }}

      - name: Upload mismatch report (for diagnosis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-mismatches
          path: data/rebuild_mismatches.csv
          if-no-files-found: ignore

      - name: Commit and push rebuilt data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/stats.db data/stats_payload.json
          git diff --staged --quiet || git commit -m "chore: rebuild outcomes for horizons T+1/5/10/20/40 $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M %Z')"
          git push
